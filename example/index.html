<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>field-assist Complete Example</title>
    <style>
        :root {
            --p: #2563eb;
            --bg: #f8fafc;
            --txt: #1e293b;
            --brd: #e2e8f0;
            --err: #ef4444;
            --lbl: #1e3a8a; /* Dark blue for labels */
        }

        body {
            font: 14px/1.5 system-ui, sans-serif;
            color: var(--txt);
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem;
            background: var(--bg);
        }

        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;

            & section {
                background: #fff;
                padding: 1rem;
                border-radius: 0.5rem;
                border: 1px solid var(--brd);
            }
        }

        .autoform, #manual-form {
            /* Field-Label Blocks */
            & .field-group > div, & > div:not(.field-group), & .form-row {
                margin-bottom: 0.75rem;
                padding: 0.75rem;
                border: 1px solid var(--brd);
                border-radius: 0.4rem;
                background: #fff;
                
                & label {
                    display: block;
                    font-weight: 700;
                    font-size: 0.8rem;
                    margin-bottom: 0.4rem;
                    color: var(--lbl);
                }
            }

            /* Group Styling */
            & .field-group {
                border: 2px solid var(--p);
                padding: 1rem;
                margin-bottom: 1.5rem;
                border-radius: 0.6rem;
                background: #f1f5f9;

                & .group-label {
                    font-weight: 800;
                    color: #fff;
                    margin-bottom: 0.5rem;
                    font-size: 0.85rem;
                    text-transform: uppercase;
                    background: var(--p);
                    display: inline-block;
                    padding: 0.2rem 0.6rem;
                    border-radius: 0.2rem;
                }

                & .group-text {
                    font-size: 0.85rem;
                    color: #64748b;
                    margin-bottom: 1rem;
                    font-style: italic;
                }
            }
        }

        input:not([type="checkbox"]):not([type="radio"]), select, textarea {
            width: 100%;
            padding: 0.4rem;
            border: 1px solid var(--brd);
            border-radius: 0.25rem;
            font-size: 0.85rem;
            background: #fdfdfd;
            box-sizing: border-box;
            &:focus { outline: 2px solid var(--p); border-color: var(--p); }
            &:invalid { border-color: var(--err); }
        }

        .results-area {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;

            & pre {
                background: #1e293b;
                color: #f1f5f9;
                padding: 0.75rem;
                border-radius: 0.4rem;
                font-size: 0.7rem;
                overflow: auto;
                max-height: 250px;
            }
            & #output-errors { color: #fca5a5; }
        }

        .actions { display: flex; gap: 0.4rem; margin-top: 1rem; }

        button {
            padding: 0.4rem 0.8rem;
            border-radius: 0.25rem;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid var(--brd);
            background: #fff;
            
            &.primary { background: var(--p); color: #fff; border: none; }
            &.wizard-nav { background: #10b981; color: #fff; border: none; }
        }

        .error-message {
            display: none;
            color: var(--err);
            font-size: 0.7rem;
            margin-top: 0.4rem;
            font-weight: 600;
        }

        input.is-invalid, select.is-invalid, textarea.is-invalid {
            border-color: var(--err) !important;
            background-color: #fff1f2 !important;
        }
    </style>
</head>
<body>

<div id="protocol-warning" style="display:none; background: #fee2e2; color: #991b1b; padding: 1rem; text-align: center; font-weight: bold; border-bottom: 2px solid #ef4444;">
    ⚠️ Error: ES Modules require a local server. Please run "npx http-server ." in the project root.
</div>

<h1>field-assist Library Features</h1>

<div class="container">
    <section id="manual-section">
        <h2>1. Manual HTML Form</h2>
        <div id="manual-form">
            <div class="form-row">
                <label>User Name (Pattern: A-Z only):</label>
                <input ref="user.name" type="text" pattern="[a-zA-Z ]*">
            </div>
            <div class="form-row">
                <label>Age (Custom Validator: < 120):</label>
                <input ref="user.age" type="number" validator="(v) => v > 0 && v < 120">
            </div>
            <div class="form-row">
                <label>Bio (Textarea):</label>
                <textarea ref="user.bio" rows="2"></textarea>
            </div>
        </div>
        <div class="actions">
            <button onclick="doPopulateManual()" class="primary">Populate Manual Form</button>
        </div>
    </section>

    <section id="auto-section">
        <h2>2. AutoForm (Grouped)</h2>
        <div id="auto-form-container"></div>
    </section>

    <section id="wizard-section" style="grid-column: 1 / -1;">
        <h2>3. Wizard Form (Multi-step)</h2>
        <div id="wizard-form-container"></div>
        <div class="actions">
            <button class="wizard-nav" onclick="window.wizard.prev()">Previous</button>
            <button class="wizard-nav" onclick="window.wizard.next()">Next</button>
            <button onclick="window.wizard.goTo('finish')">Jump to Finish</button>
        </div>
    </section>
</div>

<div class="results-area">
    <div>
        <h3>Live Data (collectValues)</h3>
        <pre id="output-data">{}</pre>
    </div>
    <div>
        <h3>Validation Errors (_errors)</h3>
        <pre id="output-errors">None</pre>
    </div>
</div>

<script type="module">
    import { populateFields, collectValues, disable, AutoForm, Wizard } from "../lib/field-assist.js";

    if (window.location.protocol === 'file:') {
        document.getElementById('protocol-warning').style.display = 'block';
    }

    const initialData = {
        user: { name: 'John Doe', age: 30, bio: 'Software engineer.' },
        account: { email: 'john@example.com', newsletter: true },
        preferences: { theme: 'dark' },
        status: 'single'
    };

    window.doPopulateManual = () => {
        populateFields(document.getElementById('manual-form'), initialData);
        updateOutput();
    };

    // --- 2. AUTO-FORM (GROUPED) ---
    const autoMeta = {
        'user.name': { label: 'Full Name', group: 'personal' },
        'user.age': { label: 'Age', group: 'personal', attributes: { type: 'number' } },
        'account.email': { label: 'Email Address', group: 'account' },
        'account.newsletter': { label: 'Subscribe?', group: 'account', componentType: 'checkbox' }
    };
    
    const autoGroups = {
        personal: { label: 'User Identity', text: 'Enter your basic profile information.' },
        account: { label: 'Security & Updates', text: 'Configure your communication settings.' }
    };

    const autoForm = new AutoForm(autoMeta);
    autoForm.groups = autoGroups;
    autoForm.render(initialData, document.getElementById('auto-form-container'));
    populateFields(document.getElementById('auto-form-container'), initialData);

    // --- 3. WIZARD FORM ---
    const wizardMeta = {
        'user.name': { label: 'What is your name?', group: 'start', attributes: { required: 'required' } },
        'user.bio': { label: 'Tell us about yourself (Ungrouped -> Default)' }, 
        'preferences.theme': { label: 'Choose Theme', group: 'settings', componentType: 'select', options: ['light', 'dark'] },
        'status': { label: 'Final Status', group: 'finish', componentType: 'radio', options: ['single', 'married'] }
    };

    const wizardGroups = {
        start: { label: 'Step 1: Introduction', text: 'Your name is mandatory to proceed.' },
        settings: { label: 'Step 2: Preferences', text: 'Customize your experience.' },
        finish: { label: 'Step 3: Confirmation', text: 'Check your final status.' }
    };

    const wizard = new Wizard(wizardMeta);
    wizard.groups = wizardGroups;
    wizard.onPageChange = (step) => { console.log(`Wizard page changed to index ${step.newIndex}`); };
    wizard.render(initialData, document.getElementById('wizard-form-container'));
    populateFields(document.getElementById('wizard-form-container'), initialData);
    
    window.wizard = wizard;

    function updateOutput() {
        const allData = collectValues(document.body);
        populateFields(document.getElementById('manual-form'), allData);
        populateFields(document.getElementById('auto-form-container'), allData);
        populateFields(document.getElementById('wizard-form-container'), allData);
        
        document.getElementById('output-data').textContent = JSON.stringify(allData, (key, value) => {
            if (typeof value === 'symbol') return 'Symbol(Invalid)';
            return value;
        }, 2);

        const errors = allData._errors;
        document.getElementById('output-errors').textContent = errors ? JSON.stringify(errors, null, 2) : 'None';
    }
    window.updateOutput = updateOutput;

    document.body.addEventListener('input', updateOutput);
    document.body.addEventListener('change', updateOutput);
    updateOutput();
</script>
</body>
</html>
